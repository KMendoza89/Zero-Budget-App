<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2fb344">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2730%27 fill=%27%232fb344%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-size=%2736%27 font-family=%27Arial%27 font-weight=%27bold%27 text-anchor=%27middle%27 fill=%27white%27%3E$%3C/text%3E%3C/svg%3E">
<title>ZeroBudget — Local Zero-Based Budget</title>
<style>
:root{
  --bg:#f3f6f9;--card:#fff;--ink:#1c2733;--muted:#6a7888;--line:#e3e9ef;--soft:#f6f8fa;
  --brand:#2fb344;--brand-d:#248a35;--brand-l:#e5f6e8;
  --ok:#2fb344;--warn:#f2a20c;--over:#e5484d;--blue:#3b82f6;
  --ok-l:#e5f6e8;--warn-l:#fff4db;--over-l:#fde8e8;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.08);--r:12px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1419;--card:#18212b;--ink:#e8edf2;--muted:#93a1b0;--line:#2a3643;--soft:#1d2833;
    --brand-l:#14301b;--ok-l:#14301b;--warn-l:#3a2d0c;--over-l:#3d1a1c;--shadow:0 1px 3px rgba(0,0,0,.4)}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
h3,h4{margin:0}
b{font-weight:650}
.muted{color:var(--muted)}
.neg{color:var(--over)}.pos{color:var(--ok)}
.grow{flex:1}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.hdr-row{display:flex;align-items:center;gap:14px;padding:8px 20px;max-width:1280px;margin:0 auto;flex-wrap:wrap}
.hdr-row.sub{padding-top:2px;padding-bottom:10px;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:750;font-size:17px;letter-spacing:-.2px}
.logo{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800}
.tabs{display:flex;gap:4px;flex:1}
.tab{border:0;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
.tab:hover{background:var(--soft)}
.tab.on{background:var(--brand-l);color:var(--brand-d)}
@media (prefers-color-scheme:dark){.tab.on{color:#7ddc8c}}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:99px;background:var(--over);color:#fff;font-size:11px;line-height:18px;text-align:center}
.hdr-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.save-ind{font-size:12px;color:var(--muted);margin-right:4px}
.month-nav{display:flex;align-items:center;gap:6px}
.month-label{font-weight:700;font-size:16px;min-width:140px;text-align:center}
.summary{display:flex;gap:8px;flex-wrap:wrap;flex:1;justify-content:flex-end;align-items:stretch}
.stat{padding:5px 12px;border-radius:10px;background:var(--soft);min-width:104px}
.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.stat strong{font-size:16px}
.pill{padding:6px 14px;border-radius:10px;font-weight:700;display:flex;align-items:center;gap:8px}
.pill small{display:block;font-weight:500;font-size:11px;opacity:.85}
.pill.ok{background:var(--ok);color:#fff}
.pill.warn{background:var(--warn-l);color:#8a5a00;border:1px solid var(--warn)}
.pill.over{background:var(--over-l);color:var(--over);border:1px solid var(--over)}
.pill.idle{background:var(--soft);color:var(--muted)}
@media (prefers-color-scheme:dark){.pill.warn{color:#f5c15a}}

/* buttons / inputs */
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.primary:disabled{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--over);border-color:var(--over)}
.btn.danger.solid{background:var(--over);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--muted);width:28px;height:28px;border-radius:6px;font-size:14px;line-height:1}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.link{border:0;background:none;color:var(--blue);cursor:pointer;padding:2px 4px;font-weight:600;font-size:12.5px}
.link:hover{text-decoration:underline}
.txt,select,textarea,input[type=date],input[type=month]{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;width:100%}
select{width:auto;max-width:100%}
.txt:focus,select:focus,textarea:focus,input:focus{outline:2px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:0;border-color:var(--brand)}
.mini{padding:4px 6px;font-size:12.5px;max-width:170px}
.search{min-width:220px;flex:1}
.mw{position:relative;display:block}
.mw::before{content:attr(data-cur);position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.mw input{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px 7px 24px;width:100%;text-align:right;font-weight:600}
input.money{text-align:right}

/* layout */
main{max-width:1280px;margin:0 auto;padding:16px 20px 40px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.side{position:sticky;top:122px;max-height:calc(100vh - 140px);display:flex}
.side-card{display:flex;flex-direction:column;width:100%;min-height:0}
@media (max-width:980px){.layout{grid-template-columns:1fr}.side{position:static;max-height:none}.hdr{position:static}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px}
.empty{padding:14px 16px;color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 2px 10px}
.legend i,.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:var(--line)}
.dot.ok,.legend i.ok{background:var(--ok)}.dot.warn,.legend i.warn{background:var(--warn)}.dot.over,.legend i.over{background:var(--over)}.dot.idle{background:var(--line)}

/* income */
.income-card .inc-row{display:grid;grid-template-columns:1fr 140px auto auto;gap:10px;align-items:center;padding:6px 16px}
.income-card .link{margin:4px 12px 10px}
.income-card .inc-row .money{padding-left:10px}

/* groups */
.group-h{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--soft);border-bottom:1px solid var(--line);flex-wrap:wrap}
.group-h h3{font-size:15px;flex:1;min-width:120px}
.gt{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.gt b{color:var(--ink)}
.g-tools{display:flex}
.cat-row{display:grid;grid-template-columns:minmax(150px,1.1fr) 120px minmax(190px,1.7fr) 60px;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);transition:background .12s}
.group-b .cat-row:first-child{border-top:0}
.cat-row:hover{background:var(--soft)}
.cat-row.drop-target,.income-card.drop-target{background:var(--brand-l);outline:2px dashed var(--brand);outline-offset:-3px}
.cat-name{display:flex;align-items:center;gap:4px;min-width:0}
.name-btn{border:0;background:none;padding:0;cursor:pointer;font-weight:600;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name-btn:hover{text-decoration:underline}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:11px;color:var(--muted);margin-left:6px;white-space:nowrap;font-weight:600}
.tag.goal{background:var(--brand-l);color:var(--brand-d);border-color:transparent}
.tag.fund{background:#e8f0fe;color:#2b5fc7;border-color:transparent}
.tag.ok{background:var(--ok-l);color:var(--brand-d);border-color:transparent}
.tag.warn{background:var(--warn-l);color:#8a5a00;border-color:transparent}
.tag.idle{background:var(--soft)}
.cat-progress .stats{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.cat-progress .stats b{color:var(--ink)}
.left.ok{color:var(--brand-d);font-weight:650}.left.warn{color:#b07400;font-weight:650}.left.over{color:var(--over);font-weight:650}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .25s}
.fill.ok{background:var(--ok)}.fill.warn{background:var(--warn)}.fill.over{background:var(--over)}.fill.idle{background:transparent}
.row-tools{display:flex;justify-content:flex-end;opacity:.35}
.cat-row:hover .row-tools{opacity:1}
.add-row{padding:4px 12px 10px;border-top:1px solid var(--line)}
.add-group{text-align:center;margin:6px 0 20px}
@media (max-width:640px){
  .cat-row{grid-template-columns:1fr 120px}
  .cat-progress{grid-column:1/-1}
  .row-tools{display:none}
  .income-card .inc-row{grid-template-columns:1fr 110px auto}
}

/* side panel */
.side-card .card-h{padding-bottom:6px}
.seg{display:flex;gap:4px;padding:0 12px 8px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);padding:6px 8px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12.5px}
.seg button.on{background:var(--brand-l);border-color:var(--brand);color:var(--brand-d)}
.side-tools{display:flex;gap:6px;padding:0 12px 8px}
.side-tools select{font-size:12.5px;padding:6px}
.side-list{overflow:auto;padding:0 12px 12px;flex:1;min-height:80px}
.txn-card{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:var(--card);cursor:grab}
.txn-card:hover{border-color:var(--brand)}
.txn-card.dragging{opacity:.4}
.tc-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.tc-amt{font-weight:700;font-size:14px}
.tc-desc{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 6px}
.tc-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:2px 9px;font-size:12px;cursor:pointer}
span.chip{cursor:default}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0}
body.dragging-txn .cat-row{outline:1px dashed var(--line);outline-offset:-3px}

/* transactions tab */
.tx-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.tx-row{display:grid;grid-template-columns:28px 112px minmax(120px,1.5fr) minmax(190px,1.1fr) 112px 92px;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.tx-row.head{background:var(--soft);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;border-top:0;font-weight:650}
.tx-row.head button{border:0;background:none;text-transform:uppercase;letter-spacing:.4px;font-size:12px;font-weight:650;color:inherit;cursor:pointer;text-align:left;padding:0}
.tx-row.head button:hover{color:var(--ink)}
.tx-row.sel{background:var(--brand-l)}
.tx-row .desc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
.tx-row .amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.tx-row .acts{display:flex;justify-content:flex-end}
.tx-foot{padding:10px 14px;display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);flex-wrap:wrap;gap:6px}
.bulk{display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--brand-l);flex-wrap:wrap}
@media (max-width:760px){
  .tx-row{grid-template-columns:28px 1fr auto}
  .tx-row .cat-cell{grid-column:2/-1}
  .tx-row .date{font-size:12px;color:var(--muted)}
  .tx-row.head{display:none}
}

/* goals */
.goals-head{padding:16px}
.goal-stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px}
.goal-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.goal{display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);background:var(--card);position:relative}
.goal.dragging{opacity:.4}
.goal.drop-above::before,.goal.drop-below::after{content:"";position:absolute;left:8px;right:8px;height:3px;background:var(--brand);border-radius:3px}
.goal.drop-above::before{top:-2px}.goal.drop-below::after{bottom:-2px}
.g-rank{display:flex;flex-direction:column;align-items:center;gap:4px}
.g-rank .num{font-size:24px;font-weight:800;color:var(--brand-d)}
.grip{cursor:grab;color:var(--muted);font-size:18px;line-height:1;user-select:none}
.g-title{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.g-title b{font-size:15px}
.g-stats{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.g-stats b{color:var(--ink)}
.g-actions{display:flex;flex-direction:column;gap:2px}
.g-actions .row{display:flex}
@media (max-width:640px){.goal{grid-template-columns:60px 1fr}.g-actions{grid-column:1/-1;flex-direction:row}}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,18,28,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px 14px;overflow:auto}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:480px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .14s ease-out}
.modal.wide{max-width:720px}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-b{padding:16px 18px;max-height:68vh;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:12px;color:var(--muted);font-weight:650;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.span2{grid-column:1/-1}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0 12px;cursor:pointer}
.chk input{width:auto}
.split-h{display:flex;justify-content:space-between;align-items:center;margin:6px 0 8px}
.split-info{font-weight:700;font-size:13px}
.split-info.ok{color:var(--ok)}.split-info.over{color:var(--over)}.split-info.warn{color:#b07400}
.sp-row{display:grid;grid-template-columns:1fr 130px 30px;gap:8px;margin-bottom:8px}
.sp-row select{width:100%}
.row-gap{display:flex;gap:6px;flex-wrap:wrap}
.err{color:var(--over);font-weight:600;margin-top:8px;min-height:18px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:34px 20px;text-align:center;cursor:pointer;transition:.15s;background:var(--soft)}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-l)}
.drop-ic{font-size:28px;color:var(--brand)}
.paste{margin-top:14px}
.paste summary{cursor:pointer;color:var(--blue);font-weight:600}
.paste textarea{margin:8px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px}
.map-grid select{width:100%}
table.pv{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
table.pv th,table.pv td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
table.pv th{color:var(--muted);font-size:11px;text-transform:uppercase}
table.pv td.r,table.pv th.r{text-align:right}
table.pv tr.bad td{color:var(--over);background:var(--over-l)}
.imp-sum{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}

/* toast */
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1c2733;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.3);font-weight:550;max-width:90vw;animation:pop .15s}
.toast.warn{background:#8a5a00}.toast.err{background:var(--over)}.toast.ok{background:var(--brand-d)}
.foot{max-width:1280px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:12px;text-align:center}

/* ── v2: currency, rules, phone layout ── */
.cur-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg-mini{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg-mini button{border:0;background:var(--card);padding:5px 10px;font-weight:650;cursor:pointer;font-size:12.5px;color:var(--ink)}
.seg-mini button.on{background:var(--brand);color:#fff}
.rate-chip{font-size:12px;color:var(--muted);border:0;background:none;cursor:pointer;padding:3px 6px;border-radius:6px}
.rate-chip:hover{background:var(--soft);color:var(--ink)}
.conv-note{font-size:12px;font-weight:650;color:#8a5a00;background:var(--warn-l);padding:3px 10px;border-radius:99px}
@media (prefers-color-scheme:dark){.conv-note{color:#f5c15a}}
.orig{display:block;font-size:11px;color:var(--muted);font-weight:500}
input:disabled{opacity:.7;cursor:not-allowed}
.notice{background:var(--warn-l);border:1px solid var(--warn);color:var(--ink);padding:10px 12px;border-radius:10px;margin-bottom:12px}
.notice+.notice{margin-top:-4px}
.toast{pointer-events:auto}
.toast .tbtn{margin-left:12px;background:#fff;color:#1c2733;border:0;border-radius:6px;padding:3px 10px;font-weight:700;cursor:pointer}
.rule-row2{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.rule-row2 .rule-txt{flex:1;min-width:0;overflow-wrap:anywhere}
.rule-tools{display:flex}
.hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.tabs .tab.inbox-tab{display:none}
@media (max-width:980px){
  .tabs .tab.inbox-tab{display:inline-block}
  main[data-view=budget] .side{display:none}
  main[data-view=inbox] #budgetCol{display:none}
}
@media (max-width:760px){
  .tx-row{grid-template-columns:28px 1fr auto;grid-template-areas:"chk date amt" "chk desc desc" "chk cat cat" "chk acts acts"}
  .tx-row .row-chk{grid-area:chk;align-self:start}
  .tx-row .date{grid-area:date}
  .tx-row .desc{grid-area:desc;white-space:normal}
  .tx-row .cat-cell{grid-area:cat}
  .tx-row .amt{grid-area:amt}
  .tx-row .acts{grid-area:acts;justify-content:flex-start}
  .tx-toolbar .search{min-width:100%}
}
@media (max-width:640px){
  body{padding-bottom:env(safe-area-inset-bottom)}
  .hdr-row{padding:8px 12px}
  .hdr-actions .desk,.save-ind{display:none}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));gap:2px;flex:none;box-shadow:0 -2px 8px rgba(0,0,0,.08)}
  .tab{flex:1;padding:10px 2px;font-size:12.5px;text-align:center}
  main{padding:12px 12px 96px}
  .hdr-row.sub{display:grid;grid-template-columns:1fr;gap:8px;padding-bottom:10px}
  .summary{width:100%;justify-content:stretch;gap:6px}
  .pill{order:-1;width:100%;flex:none}
  .stat{flex:1;min-width:0;padding:5px 8px}
  .stat strong{font-size:14px}
  .month-nav{width:100%;justify-content:space-between}
  .month-label{font-size:15px}
  .income-card .inc-row{grid-template-columns:1fr 112px auto}
  .income-card .inc-row>span{display:none}
  input,select,textarea{font-size:16px}
  .btn{min-height:38px}
  .icon-btn{width:38px;height:38px}

<body>
<header class="hdr">

<div id="toasts" aria-live="polite"></div>
<input type="file" id="jsonFile" accept=".json,application/json" hidden>

<script>
(() => {
'use strict';
/* ───────────────────────── helpers ───────────────────────── */
const KEY = 'zerobudget.v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const p2 = n => String(n).padStart(2, '0');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const today = () => { const d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
const curYM = () => today().slice(0, 7);
const ymOf = d => d.slice(0, 7);
const addMonths = (ym, n) => { const [y, m] = ym.split('-').map(Number); const i = y * 12 + (m - 1) + n; return Math.floor(i / 12) + '-' + p2(i % 12 + 1); };
const monthDiff = (a, b) => { const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number); return (yb - ya) * 12 + (mb - ma); };
const monthLabel = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }); };
const fmtDate = d => { const [y, m, dd] = d.split('-'); return MON[m - 1] + ' ' + (+dd) + ', ' + y; };
const SYM = { USD: '$', CRC: '₡' };
const otherCur = c => (c === 'USD' ? 'CRC' : 'USD');
const converted = () => S.settings.view === 'other' && S.settings.rate > 0;
const viewCur = () => (converted() ? otherCur(S.settings.base) : S.settings.base);
const curSym = () => SYM[viewCur()] || '$';
function conv(c) { if (!converted()) return c; const r = S.settings.rate; return Math.round(S.settings.base === 'CRC' ? c / r : c * r); }
function fmtCur(c, cur) { const a = Math.abs(c), whole = cur === 'CRC' && a % 100 === 0; return (c < 0 ? '-' : '') + (SYM[cur] || '$') + (a / 100).toLocaleString('en-US', { minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2 }); }
const fmt = c => fmtCur(conv(c), viewCur());
const fmtBase = c => fmtCur(c, S.settings.base);
function convGuard() { if (!converted()) return false; toast('You’re viewing in ' + viewCur() + ' — switch back to ' + S.settings.base + ' to add or edit amounts.', 'warn'); return true; }
const toInput = c => c ? (c / 100).toFixed(2).replace(/\.00$/, '') : '';

/* Parse a money string into integer cents (signed). Handles $, (parens), trailing minus, 1,234.56 and 1.234,56 */
function parseAmount(raw) {
  if (raw == null) return null;
  let s = String(raw).trim(); if (!s) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (s.includes('-')) neg = true;
  s = s.replace(/[^\d.,]/g, ''); if (!s || !/\d/.test(s)) return null;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (lc > -1) { const after = s.length - lc - 1; s = (s.split(',').length > 2 || after === 3) ? s.replace(/,/g, '') : s.replace(',', '.'); }
  else if (s.split('.').length > 2) s = s.replace(/\./g, '');
  const n = parseFloat(s); if (isNaN(n)) return null;
  const c = Math.round(n * 100); return neg ? -c : c;
}
const parseMoney = s => Math.abs(parseAmount(s) ?? 0);

/* ───────────────────────── state ───────────────────────── */
let storageOK = true, rev = 0, S;

function slug(s) { return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, ''); }
function guessBase() { try { if (/es-CR|Costa_Rica/.test((navigator.language || '') + ' ' + Intl.DateTimeFormat().resolvedOptions().timeZone)) return 'CRC'; } catch (e) { } return 'USD'; }
function defaultState() {
  const g = (name, cats) => ({ id: 'g_' + slug(name), name, cats: cats.map(c => { const o = typeof c === 'string' ? { name: c } : c; return { id: 'c_' + slug(o.name), ...o }; }) });
  return {
    version: 1,
    settings: { base: guessBase(), view: 'base', rate: null, rateDate: '', rateSrc: '', rateName: '', autoRate: true, autoFlow: false, csvMaps: {} },
    groups: [
      g('Housing', ['Rent / Mortgage', 'Home Maintenance', 'Hardware / Home']),
      g('Food', ['Groceries', 'Restaurants']),
      g('Utilities', ['Electricity', 'Water', 'Internet', 'Phone']),
      g('Transportation', ['Fuel', 'Car Maintenance']),
      g('Lifestyle', ['Entertainment', 'Personal Care']),
      { id: 'g_projects', name: 'Future Projects', locked: true, cats: [] },
      g('Sinking Funds', [{ name: 'Emergency Fund', fund: true }, { name: 'Car Repairs', fund: true }, { name: 'Gifts & Holidays', fund: true }])
    ],
    months: {}, txns: [], projects: [], rules: [], modAt: 0
  };
}

/* Keeps the locked "Future Projects" group in sync with the ranked project list (one category per project). */
function syncProjectCats(st = S) {
  let g = st.groups.find(x => x.id === 'g_projects');
  if (!g) { g = { id: 'g_projects', name: 'Future Projects', locked: true, cats: [] }; st.groups.push(g); }
  g.locked = true;
  const byProj = new Map(g.cats.filter(c => c.projectId).map(c => [c.projectId, c]));
  g.cats = st.projects.map(p => {
    const c = byProj.get(p.id) || { id: uid(), projectId: p.id };
    c.name = p.name; c.fund = true; return c;
  });
}

function normalize(o) {
  if (!o || typeof o !== 'object' || Array.isArray(o)) throw new Error('This file is not a ZeroBudget backup.');
  if (!['groups', 'txns', 'months', 'projects'].some(k => k in o)) throw new Error('This file does not look like a ZeroBudget backup.');
  const int = v => Math.max(0, Math.round(Number(v) || 0));
  const def = defaultState();
  const s = { version: 1, settings: { base: 'USD', view: 'base', rate: null, rateDate: '', rateSrc: '', rateName: '', autoRate: true, autoFlow: false, csvMaps: {} }, groups: [], months: {}, txns: [], projects: [], rules: [], modAt: Number(o.modAt) || 0 };
  const so = o.settings || {};
  s.settings.base = so.base === 'CRC' || so.base === 'USD' ? so.base : (so.currency === '₡' ? 'CRC' : 'USD');
  s.settings.view = so.view === 'other' ? 'other' : 'base';
  s.settings.rate = Number(so.rate) > 0 ? Number(so.rate) : null;
  s.settings.rateDate = /^\d{4}-\d{2}-\d{2}$/.test(so.rateDate || '') ? so.rateDate : '';
  s.settings.rateSrc = so.rateSrc === 'manual' ? 'manual' : (s.settings.rate ? 'auto' : '');
  s.settings.rateName = String(so.rateName || '').slice(0, 40);
  s.settings.autoRate = so.autoRate !== false;
  s.settings.autoFlow = !!so.autoFlow;
  s.settings.csvMaps = so.csvMaps && typeof so.csvMaps === 'object' ? so.csvMaps : {};
  const srcGroups = Array.isArray(o.groups) ? o.groups : def.groups;
  const used = new Set();
  const nid = id => { id = String(id || uid()); while (used.has(id)) id = uid(); used.add(id); return id; };
  for (const g of srcGroups) {
    if (!g || typeof g !== 'object') continue;
    s.groups.push({
      id: g.id === 'g_projects' ? 'g_projects' : nid(g.id), name: String(g.name || 'Group').slice(0, 60),
      locked: g.id === 'g_projects', collapsed: !!g.collapsed,
      cats: (Array.isArray(g.cats) ? g.cats : []).filter(c => c && typeof c === 'object').map(c => ({
        id: nid(c.id), name: String(c.name || 'Category').slice(0, 60), fund: !!c.fund, ...(c.projectId ? { projectId: String(c.projectId) } : {})
      }))
    });
  }
  s.projects = (Array.isArray(o.projects) ? o.projects : []).filter(p => p && typeof p === 'object').map(p => ({
    id: String(p.id || uid()), name: String(p.name || 'Project').slice(0, 60), target: int(p.target), saved: int(p.saved),
    date: /^\d{4}-\d{2}$/.test(p.date || '') ? p.date : ''
  }));
  syncProjectCats(s);
  // map old project cat ids so planned amounts survive: cats were kept by projectId inside syncProjectCats
  const catIds = new Set(); s.groups.forEach(g => g.cats.forEach(c => catIds.add(c.id)));
  s.rules = (Array.isArray(o.rules) ? o.rules : []).filter(r => r && typeof r === 'object' && String(r.text || '').trim() && (r.target === '__ignore' || r.target === '__income' || catIds.has(r.target)))
    .map(r => ({ id: String(r.id || uid()), text: String(r.text).slice(0, 80), mode: ['contains', 'starts', 'regex'].includes(r.mode) ? r.mode : 'contains', target: r.target }));
  for (const [k, m] of Object.entries(o.months && typeof o.months === 'object' ? o.months : {})) {
    if (!/^\d{4}-\d{2}$/.test(k) || !m) continue;
    const planned = {};
    for (const [cid, v] of Object.entries(m.planned || {})) if (catIds.has(cid)) planned[cid] = int(v);
    s.months[k] = {
      income: (Array.isArray(m.income) ? m.income : []).filter(i => i && typeof i === 'object').map(i => ({ id: String(i.id || uid()), name: String(i.name || '').slice(0, 60), amount: int(i.amount), ...(i.txnId ? { txnId: String(i.txnId) } : {}) })),
      planned
    };
  }
  for (const t of Array.isArray(o.txns) ? o.txns : []) {
    if (!t || typeof t !== 'object' || !/^\d{4}-\d{2}-\d{2}$/.test(t.date || '')) continue;
    const amount = int(t.amount); if (!amount) continue;
    const kind = t.kind === 'income' ? 'income' : 'expense';
    let splits = kind === 'expense' ? (Array.isArray(t.splits) ? t.splits : []).filter(x => x && catIds.has(x.catId)).map(x => ({ catId: x.catId, amount: int(x.amount) })) : [];
    if (splits.reduce((a, x) => a + x.amount, 0) !== amount) splits = [];
    s.txns.push({ id: String(t.id || uid()), date: t.date, desc: String(t.desc || '').slice(0, 200), amount, kind, splits, ignored: !!t.ignored, counted: kind === 'income' && !!t.counted, ...(t.auto ? { auto: true } : {}), ...(t.orig && (t.orig.cur === 'USD' || t.orig.cur === 'CRC') && int(t.orig.amount) ? { orig: { cur: t.orig.cur, amount: int(t.orig.amount) } } : {}) });
  }
  return s;
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) { console.warn('Load failed', e); if (e && e.name === 'SecurityError') storageOK = false; }
  const d = defaultState(); syncProjectCats(d); return d;
}
S = load();

let saveT = null;
function save() { S.modAt = Date.now(); clearTimeout(saveT); saveT = setTimeout(saveNow, 150); scheduleSync(); }
function saveNow() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; setInd('Saved ✓ ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })); }
  catch (e) { storageOK = false; setInd('⚠ Cannot save — export a backup'); }
}
function setInd(t) { const el = $('#saveInd'); if (el) el.textContent = t; }
window.addEventListener('beforeunload', saveNow);
window.addEventListener('pagehide', saveNow);
window.addEventListener('storage', e => { if (e.key === KEY) toast('Your budget was changed in another tab. Reload this page to see the latest data.', 'warn'); });

/* ───────────────────────── model helpers ───────────────────────── */
const UI = {
  tab: 'budget', month: curYM(),
  side: { tab: 'unassigned', q: '', scope: 'all' },
  tx: { q: '', status: 'all', cat: '', scope: 'all', sort: 'date', dir: 'desc', limit: 200 },
  sel: new Set()
};

function getMonth(ym) {
  if (!S.months[ym]) {
    const prev = Object.keys(S.months).filter(k => k < ym).sort().pop();
    const m = { income: [], planned: {} };
    if (prev) { const p = S.months[prev]; m.income = p.income.filter(i => !i.txnId).map(i => ({ id: uid(), name: i.name, amount: i.amount })); m.planned = { ...p.planned }; }
    S.months[ym] = m;
  }
  return S.months[ym];
}
let idx = { rev: -1 };
function index() {
  if (idx.rev === rev) return idx;
  const spent = {}, cats = new Map(), tx = new Map();
  for (const g of S.groups) for (const c of g.cats) cats.set(c.id, { c, g });
  for (const t of S.txns) {
    tx.set(t.id, t);
    if (t.kind !== 'expense' || t.ignored) continue;
    const ym = ymOf(t.date);
    for (const sp of t.splits || []) { const o = spent[sp.catId] || (spent[sp.catId] = {}); o[ym] = (o[ym] || 0) + sp.amount; }
  }
  return (idx = { rev, spent, cats, tx });
}
const catById = id => index().cats.get(id)?.c;
const txn = id => index().tx.get(id);
const spentIn = (catId, ym) => index().spent[catId]?.[ym] || 0;
const projectCat = pid => S.groups.find(g => g.id === 'g_projects').cats.find(c => c.projectId === pid);

function catStats(cat, ym) {
  const m = getMonth(ym), planned = m.planned[cat.id] || 0, spent = spentIn(cat.id, ym);
  let budgeted = planned, spentShown = spent;
  const rolling = !!(cat.fund || cat.projectId);
  if (rolling) {
    budgeted = 0; spentShown = 0;
    const proj = cat.projectId && S.projects.find(p => p.id === cat.projectId);
    if (proj) budgeted += proj.saved || 0;
    for (const k of Object.keys(S.months)) if (k <= ym) budgeted += S.months[k].planned[cat.id] || 0;
    const sp = index().spent[cat.id] || {};
    for (const k in sp) if (k <= ym) spentShown += sp[k];
  }
  const remaining = budgeted - spentShown;
  const pct = budgeted > 0 ? spentShown / budgeted * 100 : (spentShown > 0 ? 999 : 0);
  const status = (budgeted === 0 && spentShown === 0) ? 'idle' : pct > 100 ? 'over' : pct >= 85 ? 'warn' : 'ok';
  return { planned, spent, budgeted, spentShown, remaining, pct, status, rolling };
}
const totalIncome = ym => getMonth(ym).income.reduce((a, i) => a + i.amount, 0);
const totalPlanned = ym => { const m = getMonth(ym); let t = 0; for (const g of S.groups) for (const c of g.cats) t += m.planned[c.id] || 0; return t; };
const totalSpent = ym => { let t = 0; for (const g of S.groups) for (const c of g.cats) t += spentIn(c.id, ym); return t; };
const txnStatus = t => t.ignored ? 'ignored' : t.kind === 'income' ? (t.counted ? 'counted' : 'pending') : ((t.splits || []).length ? 'assigned' : 'pending');
const pendingCount = () => S.txns.filter(t => txnStatus(t) === 'pending').length;
const catNames = t => (t.splits || []).map(s => catById(s.catId)?.name || '').filter(Boolean).join(', ');

function removeIncomeForTxn(id) { for (const m of Object.values(S.months)) m.income = m.income.filter(i => i.txnId !== id); }
function removeCategory(catId) {
  S.rules = S.rules.filter(r => r.target !== catId);
  for (const t of S.txns) if ((t.splits || []).some(s => s.catId === catId)) t.splits = [];
  for (const m of Object.values(S.months)) delete m.planned[catId];
  for (const g of S.groups) g.cats = g.cats.filter(c => c.id !== catId);
}

/* goals */
function projCalc(p, ym) {
  const cat = projectCat(p.id), st = catStats(cat, ym), planned = getMonth(ym).planned[cat.id] || 0;
  const prior = st.remaining - planned + spentIn(cat.id, ym);
  const needed = Math.max(0, p.target - prior);
  const monthsLeft = p.date ? Math.max(1, monthDiff(ym, p.date) + 1) : null;
  const suggested = monthsLeft ? Math.ceil(needed / monthsLeft) : 0;
  return { cat, st, planned, balance: st.remaining, needed, monthsLeft, suggested, funded: st.remaining >= p.target, remainingNeed: Math.max(0, p.target - st.remaining) };
}
function syncProjects(ym) {
  const m = getMonth(ym); let nonProj = 0, skippedPlanned = 0;
  for (const g of S.groups) for (const c of g.cats) if (!c.projectId) nonProj += m.planned[c.id] || 0;
  const use = S.projects.filter(p => p.date), skip = S.projects.filter(p => !p.date);
  for (const p of skip) skippedPlanned += m.planned[projectCat(p.id).id] || 0;
  let avail = Math.max(0, totalIncome(ym) - nonProj - skippedPlanned), total = 0, short = 0;
  for (const p of use) {
    const pc = projCalc(p, ym), amt = Math.min(pc.suggested, avail);
    m.planned[pc.cat.id] = amt; avail -= amt; total += amt; if (amt < pc.suggested) short++;
  }
  return { n: use.length, total, short };
}
function flowSurplus(ym, cap = Infinity) {
  const m = getMonth(ym); let left = Math.min(cap, totalIncome(ym) - totalPlanned(ym)), used = 0;
  if (left <= 0) return 0;
  for (const p of S.projects) {
    if (left <= 0) break;
    const pc = projCalc(p, ym), add = Math.min(pc.remainingNeed, left);
    if (add > 0) { m.planned[pc.cat.id] = (m.planned[pc.cat.id] || 0) + add; left -= add; used += add; }
  }
  return used;
}
function afterIncomeChange(prevTotal, ym) {
  if (!S.settings.autoFlow) return;
  const delta = totalIncome(ym) - prevTotal;
  if (delta > 0) { const used = flowSurplus(ym, delta); if (used > 0) toast('Auto-flowed ' + fmt(used) + ' of new income to your top-ranked goals.', 'ok'); }
}

/* ───────────────────────── toasts & modals ───────────────────────── */
function toast(msg, type = '', action) {
  const el = document.createElement('div'); el.className = 'toast ' + type; el.append(document.createTextNode(msg));
  if (action) { const b = document.createElement('button'); b.className = 'tbtn'; b.textContent = action.label; b.onclick = () => { el.remove(); action.fn(); }; el.append(b); }
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), action ? 9000 : 3800);
}
const modalStack = [];
function modal({ title, body = '', footer = '', wide = false, onClose }) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true"><div class="modal-h"><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="Close">✕</button></div><div class="modal-b">${body}</div>${footer ? `<div class="modal-f">${footer}</div>` : ''}</div>`;
  document.body.appendChild(ov);
  const api = { el: ov, b: $('.modal-b', ov), f: $('.modal-f', ov), close() { const i = modalStack.indexOf(api); if (i < 0) return; modalStack.splice(i, 1); ov.remove(); onClose && onClose(); } };
  let downOnOv = false;
  ov.addEventListener('mousedown', e => { downOnOv = e.target === ov; });
  ov.addEventListener('click', e => { if (e.target.closest('[data-close]') || (e.target === ov && downOnOv)) api.close(); });
  modalStack.push(api);
  setTimeout(() => { const f = $('input:not([type=hidden]):not([type=file]),select', api.b); f && f.focus && f.focus(); }, 30);
  return api;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalStack.length) modalStack[modalStack.length - 1].close(); });
function askText({ title, label, value = '', placeholder = '', ok = 'Save' }) {
  return new Promise(res => {
    let done = false; const fin = v => { if (done) return; done = true; m.close(); res(v); };
    const m = modal({ title, body: `<label class="fld"><span>${esc(label)}</span><input class="txt" id="pIn" value="${esc(value)}" placeholder="${esc(placeholder)}" maxlength="60"></label>`,
      footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="pOk">${esc(ok)}</button>`, onClose: () => { if (!done) { done = true; res(null); } } });
    const inp = $('#pIn', m.el); inp.select();
    const go = () => { const v = inp.value.trim(); if (v) fin(v); else inp.focus(); };
    $('#pOk', m.el).onclick = go; inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  });
}
function confirmBox(msg, ok = 'Confirm', danger = false) {
  return new Promise(res => {
    let done = false; const fin = v => { if (done) return; done = true; m.close(); res(v); };
    const m = modal({ title: 'Please confirm', body: `<p style="margin:0">${esc(msg)}</p>`, footer: `<button class="btn" data-close>Cancel</button><button class="btn ${danger ? 'danger solid' : 'primary'}" id="cOk">${esc(ok)}</button>`, onClose: () => { if (!done) { done = true; res(false); } } });
    $('#cOk', m.el).onclick = () => fin(true); $('#cOk', m.el).focus();
  });
}
function catOptionsHtml(sel, ph = 'Assign…') {
  return `<option value="">${esc(ph)}</option>` + S.groups.filter(g => g.cats.length).map(g => `<optgroup label="${esc(g.name)}">${g.cats.map(c => `<option value="${c.id}"${c.id === sel ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</optgroup>`).join('');
}
const opts = (list, val) => list.map(([v, l]) => `<option value="${v}"${v === val ? ' selected' : ''}>${esc(l)}</option>`).join('');

/* ───────────────────────── rendering: shell ───────────────────────── */
function commit(structural) { rev++; save(); structural ? render() : refresh(); }
function render() {

function renderMonthNav() {

function renderSummary() {
  const ym = UI.month, inc = totalIncome(ym), alloc = totalPlanned(ym), left = inc - alloc;
  let cls, big, small;
  if (left === 0 && inc > 0) { cls = 'ok'; big = 'Every Dollar Accounted For ✓'; small = fmt(0) + ' left to budget'; }

  else { cls = 'idle'; big = 'Add income to start'; small = fmt(0) + ' left to budget'; }
  $('#summary').innerHTML = `<div class="stat"><small>Total income</small><strong>${fmt(inc)}</strong></div><div class="stat"><small>Total allocated</small><strong>${fmt(alloc)}</strong></div><div class="stat"><small>Spent</small><strong>${fmt(totalSpent(ym))}</strong></div><div class="pill ${cls}"><div>${big}<small>${small}</small></div></div>`;
}

/* ───────────────────────── Budget tab ───────────────────────── */
function incomeCard(m) {
  const rows = m.income.map(i => `<div class="inc-row"><input class="txt" data-inc-name="${i.id}" value="${esc(i.name)}" placeholder="Income source (e.g. Paycheck)" maxlength="60"><label class="mw" data-cur="${esc(curSym())}"><input data-inc-amt="${i.id}" inputmode="decimal" value="${toInput(conv(i.amount))}" ${converted() ? 'disabled' : ''} placeholder="0.00" aria-label="Income amount"></label>${i.txnId ? '<span class="tag">from bank</span>' : '<span></span>'}<button class="icon-btn" data-act="del-income" data-id="${i.id}" title="Remove" aria-label="Remove income">✕</button></div>`).join('');
  return `<div class="card income-card" id="incomeCard"><div class="card-h"><h3>Income</h3><span class="muted">Total <b id="incTotal">${fmt(m.income.reduce((a, i) => a + i.amount, 0))}</b></span></div>${rows || '<div class="empty">No income yet — add what you expect to earn this month. You can also drop a deposit transaction here.</div>'}<button class="link" data-act="add-income">+ Add income</button></div>`;
}
function progressHtml(st) {
  const w = Math.min(100, st.budgeted > 0 ? st.pct : (st.spentShown > 0 ? 100 : 0));
  const left = st.remaining >= 0 ? `${fmt(st.remaining)} ${st.rolling ? 'balance' : 'left'}` : `${fmt(-st.remaining)} over`;
  return `<div class="bar"><div class="fill ${st.status}" style="width:${w}%"></div></div><div class="stats"><span>${st.rolling ? 'Funded' : 'Budgeted'} <b>${fmt(st.budgeted)}</b></span><span>Spent <b>${fmt(st.spentShown)}</b></span><span class="left ${st.status}">${left}</span></div>`;
}
function catRow(c, ym) {

  const pi = c.projectId ? S.projects.findIndex(p => p.id === c.projectId) : -1;
  return `<div class="cat-row" data-cat="${c.id}">
    <div class="cat-name"><span class="dot ${st.status}"></span><button class="name-btn" data-act="cat-details" data-id="${c.id}" title="View transactions">${esc(c.name)}</button>${pi >= 0 ? `<span class="tag goal">Goal #${pi + 1}</span>` : c.fund ? '<span class="tag fund">Fund</span>' : ''}</div>
    <label class="mw" data-cur="${esc(curSym())}"><input class="planned" data-cat="${c.id}" inputmode="decimal" autocomplete="off" value="${m.planned[c.id] ? toInput(conv(m.planned[c.id])) : ''}" ${converted() ? 'disabled' : ''} placeholder="0.00" aria-label="Planned for ${esc(c.name)}"></label>
    <div class="cat-progress">${progressHtml(st)}</div>
    <div class="row-tools"><button class="icon-btn" data-act="edit-cat" data-id="${c.id}" title="Edit" aria-label="Edit">✎</button>${c.projectId ? '' : `<button class="icon-btn" data-act="del-cat" data-id="${c.id}" title="Delete" aria-label="Delete">✕</button>`}</div>
  </div>`;
}
function groupTotalsHtml(g, ym) {
  const m = getMonth(ym); let pl = 0, sp = 0;
  for (const c of g.cats) { pl += m.planned[c.id] || 0; sp += spentIn(c.id, ym); }
  const left = pl - sp;
  return `<span>Planned <b>${fmt(pl)}</b></span><span>Spent <b>${fmt(sp)}</b></span><span>${left < 0 ? 'Over' : 'Left'} <b class="${left < 0 ? 'neg' : ''}">${fmt(Math.abs(left))}</b></span>`;
}
function groupCard(g, ym) {
  const rows = g.cats.map(c => catRow(c, ym)).join('') || `<div class="empty">${g.locked ? 'Create a project on the Goals tab and it will show up here automatically.' : 'No categories yet.'}</div>`;

    <div class="g-tools"><button class="icon-btn" data-act="group-rename" data-id="${g.id}" title="Rename group" aria-label="Rename group">✎</button><button class="icon-btn" data-act="group-up" data-id="${g.id}" title="Move up" aria-label="Move up">↑</button><button class="icon-btn" data-act="group-down" data-id="${g.id}" title="Move down" aria-label="Move down">↓</button>${g.locked ? '' : `<button class="icon-btn" data-act="group-del" data-id="${g.id}" title="Delete group" aria-label="Delete group">🗑</button>`}</div></div>

/* side panel */
function matchesQ(t, q) {
  if (!q) return true;
  return (t.desc + ' ' + t.date + ' ' + fmtDate(t.date) + ' ' + (t.amount / 100).toFixed(2) + ' ' + catNames(t)).toLowerCase().includes(q.toLowerCase());
}
function cardActions(t) {

    ? `<button class="btn sm primary" data-act="count-income" data-id="${t.id}">Add as income</button><button class="link" data-act="ignore-txn" data-id="${t.id}">Ignore</button>`

  if (st === 'pending') return `<select class="mini" data-assign="${t.id}">${catOptionsHtml('', 'Assign to…')}</select><button class="btn sm" data-act="edit-txn" data-id="${t.id}" title="Split across several categories">Split</button><button class="link" data-act="ignore-txn" data-id="${t.id}">Ignore</button>`;
  const multi = t.splits.length > 1;
  return `<span class="chips">${t.splits.map(s => `<span class="chip">${esc(catById(s.catId)?.name || '?')}${multi ? ' · ' + fmt(s.amount) : ''}</span>`).join('')}</span>${t.auto ? '<span class="tag" title="Assigned by a rule">auto</span>' : ''}<button class="link" data-act="edit-txn" data-id="${t.id}">Edit</button><button class="link" data-act="unassign" data-id="${t.id}" title="Move back to Unassigned">Undo</button>`;
}
function txnCard(t) {

  return `<div class="txn-card" draggable="true" data-txn="${t.id}"><div class="tc-top"><span>${fmtDate(t.date)}</span><span class="tc-amt ${inc ? 'pos' : 'neg'}">${inc ? '+' : '-'}${fmt(t.amount)}${t.orig ? `<span class="orig">${fmtCur(t.orig.amount, t.orig.cur)}</span>` : ''}</span></div><div class="tc-desc" title="${esc(t.desc)}">${esc(t.desc) || '(no description)'}</div><div class="tc-actions">${cardActions(t)}</div></div>`;
}
function renderSideList() {
  const seg = $('#sideSeg'), list = $('#sideList'); if (!seg || !list) return;
  const sc = UI.side.scope, ym = UI.month;

    <button class="btn" id="txDir" title="Toggle sort direction"></button>

}
const updateDirBtn = () => { const b = $('#txDir'); if (b) b.textContent = UI.tx.dir === 'asc' ? '↑ Asc' : '↓ Desc'; };
function filteredTxns() {
  const f = UI.tx, ym = UI.month;
  const list = S.txns.filter(t => {
    if (f.scope === 'month' && ymOf(t.date) !== ym) return false;
    const st = txnStatus(t);
    if (f.status === 'pending' && st !== 'pending') return false;
    if (f.status === 'assigned' && st !== 'assigned' && st !== 'counted') return false;
    if (f.status === 'ignored' && st !== 'ignored') return false;
    if (f.cat === '__none') { if (st !== 'pending') return false; }
    else if (f.cat && !(t.splits || []).some(s => s.catId === f.cat)) return false;
    return matchesQ(t, f.q.trim());
  });
  const dir = f.dir === 'asc' ? 1 : -1;
  const key = { date: t => t.date, merchant: t => t.desc.toLowerCase(), category: t => catNames(t).toLowerCase(), amount: t => t.kind === 'income' ? t.amount : -t.amount }[f.sort];
  return list.sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : (a.date < b.date ? 1 : -1)) * dir; });
}
function txRow(t) {
  const st = txnStatus(t), inc = t.kind === 'income'; let cat;

  else if (inc) cat = t.counted ? '<span class="tag ok" style="margin:0">Counted as income</span>' : `<button class="btn sm" data-act="count-income" data-id="${t.id}">Add to income</button> <button class="link" data-act="ignore-txn" data-id="${t.id}">Ignore</button>`;
  else if ((t.splits || []).length > 1) cat = `<button class="chip" data-act="edit-txn" data-id="${t.id}" title="${esc(catNames(t))}">Split · ${t.splits.length} categories</button>`;
  else cat = `<select class="mini" data-assign="${t.id}">${catOptionsHtml(t.splits?.[0]?.catId, 'Unassigned')}</select>${t.auto ? ' <span class="tag" title="Assigned by a rule">auto</span>' : ''}${st === 'pending' ? ' <button class="link" data-act="ignore-txn" data-id="' + t.id + '">Ignore</button>' : ''}`;
  return `<div class="tx-row ${UI.sel.has(t.id) ? 'sel' : ''}" data-row="${t.id}"><input type="checkbox" class="row-chk" data-id="${t.id}" ${UI.sel.has(t.id) ? 'checked' : ''} aria-label="Select"><span class="date">${fmtDate(t.date)}</span><span class="desc" title="${esc(t.desc)}">${esc(t.desc) || '(no description)'}</span><span class="cat-cell">${cat}</span><span class="amt ${inc ? 'pos' : 'neg'}">${inc ? '+' : '-'}${fmt(t.amount)}${t.orig ? `<span class="orig">${fmtCur(t.orig.amount, t.orig.cur)}</span>` : ''}</span><span class="acts">${inc ? '' : `<button class="icon-btn" data-act="edit-txn" data-id="${t.id}" title="Split across categories" aria-label="Split">✂</button>`}<button class="icon-btn" data-act="edit-txn" data-id="${t.id}" title="Edit" aria-label="Edit">✎</button><button class="icon-btn" data-act="del-txn" data-id="${t.id}" title="Delete" aria-label="Delete">🗑</button></span></div>`;
}
let lastFilteredIds = [];

/* ───────────────────────── Goals tab ───────────────────────── */
function goalStatus(p, pc) {
  if (pc.funded) return ['ok', 'Fully funded 🎉'];
  if (!p.date) return pc.planned > 0 ? ['ok', 'Funding this month'] : ['idle', 'Not funded this month'];
  if (pc.planned >= pc.suggested) return ['ok', 'On track'];
  return ['warn', 'Needs ' + fmt(pc.suggested - pc.planned) + ' more this month'];
}
function renderGoals(el) {
  const ym = UI.month, calcs = S.projects.map(p => [p, projCalc(p, ym)]);
  const tTarget = calcs.reduce((a, [p]) => a + p.target, 0), tBal = calcs.reduce((a, [, c]) => a + Math.max(0, c.balance), 0);
  const tSug = calcs.reduce((a, [, c]) => a + c.suggested, 0), tPlan = calcs.reduce((a, [, c]) => a + c.planned, 0);
  const left = totalIncome(ym) - totalPlanned(ym);
  const cards = calcs.map(([p, pc], i) => {
    const pct = p.target ? Math.max(0, Math.min(100, pc.balance / p.target * 100)) : 0, [sc, stxt] = goalStatus(p, pc);
    return `<div class="goal" draggable="true" data-goal="${p.id}">
      <div class="g-rank"><span class="grip" title="Drag to re-rank">⠿</span><span class="num">#${i + 1}</span><select class="mini" data-rank="${p.id}" aria-label="Rank">${S.projects.map((_, k) => `<option value="${k + 1}"${k === i ? ' selected' : ''}>Rank ${k + 1}</option>`).join('')}</select></div>
      <div><div class="g-title"><b>${esc(p.name)}</b><span class="tag ${sc}" style="margin:0">${esc(stxt)}</span></div>
        <div class="bar"><div class="fill ${sc === 'warn' ? 'warn' : 'ok'}" style="width:${pct}%"></div></div>
        <div class="g-stats"><span><b>${fmt(Math.max(0, pc.balance))}</b> of <b>${fmt(p.target)}</b> (${Math.round(pct)}%)</span>${p.date ? `<span>Target <b>${monthLabel(p.date)}</b> · ${pc.monthsLeft} mo left</span>` : '<span>No target date</span>'}${p.date && !pc.funded ? `<span>Suggested <b>${fmt(pc.suggested)}</b>/mo</span>` : ''}<span>This month <b>${fmt(pc.planned)}</b></span></div></div>
      <div class="g-actions"><div class="row"><button class="icon-btn" data-act="goal-up" data-id="${p.id}" title="Rank up" aria-label="Rank up">↑</button><button class="icon-btn" data-act="goal-down" data-id="${p.id}" title="Rank down" aria-label="Rank down">↓</button></div><div class="row"><button class="icon-btn" data-act="goal-edit" data-id="${p.id}" title="Edit" aria-label="Edit">✎</button><button class="icon-btn" data-act="goal-del" data-id="${p.id}" title="Delete" aria-label="Delete">🗑</button></div></div></div>`;
  }).join('');
  el.innerHTML = `<div class="card"><div class="goals-head"><div class="card-h" style="padding:0"><div><h3 style="font-size:18px">Future Projects &amp; Ranked Goals</h3><div class="muted">Rank #1 is funded first. Each goal becomes a sinking-fund category in your monthly budget. Balances shown as of ${monthLabel(ym)}.</div></div><button class="btn primary" data-act="goal-add">+ New Project</button></div>
    <div class="goal-stats"><div class="stat"><small>Total targets</small><strong>${fmt(tTarget)}</strong></div><div class="stat"><small>Funded so far</small><strong>${fmt(tBal)}</strong></div><div class="stat"><small>Suggested / month</small><strong>${fmt(tSug)}</strong></div><div class="stat"><small>Planned this month</small><strong>${fmt(tPlan)}</strong></div><div class="stat"><small>Left to budget</small><strong class="${left < 0 ? 'neg' : ''}">${fmt(left)}</strong></div></div>
    <div class="goal-actions"><button class="btn" data-act="sync-goals" title="Set this month's goal categories to the suggested monthly amount, funding by rank until your income runs out">Sync to ${monthLabel(ym)} budget</button><button class="btn" data-act="flow-goals" title="Move any unallocated income into the top-ranked unfunded goals">Flow surplus to goals</button><label class="chk" style="margin:0 0 0 6px"><input type="checkbox" id="autoFlow" ${S.settings.autoFlow ? 'checked' : ''}> Auto-flow new income surplus to top-ranked goals</label></div></div>
    ${cards || '<div class="empty" style="text-align:center;padding:36px">No projects yet. Add a target purchase — a laptop, a trip, a remodel — and rank it.</div>'}</div>`;

function moveGoalTo(id, targetId, below) {

  'bulk-del': async () => { if (await confirmBox(`Delete ${UI.sel.size} selected transaction(s)?`, 'Delete', true)) { for (const id of UI.sel) removeIncomeForTxn(id); S.txns = S.txns.filter(t => !UI.sel.has(t.id)); UI.sel.clear(); commit(true); } },
  'goal-add': () => openProject(),
  'goal-edit': el => openProject(el.dataset.id),
  'goal-del': async el => { const p = S.projects.find(x => x.id === el.dataset.id); if (await confirmBox(`Delete the project “${p.name}”? Transactions assigned to it will go back to Unassigned.`, 'Delete project', true)) { removeCategory(projectCat(p.id).id); S.projects = S.projects.filter(x => x.id !== p.id); syncProjectCats(); commit(true); } },
  'goal-up': el => { const i = S.projects.findIndex(p => p.id === el.dataset.id); if (i > 0) setRank(el.dataset.id, i); },
  'goal-down': el => { const i = S.projects.findIndex(p => p.id === el.dataset.id); if (i < S.projects.length - 1) setRank(el.dataset.id, i + 2); },
  'sync-goals': () => { if (!S.projects.length) return toast('Add a project first.', 'warn'); const r = syncProjects(UI.month); commit(true); toast(r.n ? `Synced ${r.n} goal(s): ${fmt(r.total)} planned this month${r.short ? ' — lower-ranked goals were limited by available income' : ''}` : 'Give your projects a target month to get monthly suggestions.', r.short ? 'warn' : 'ok'); },
  'flow-goals': () => { const used = flowSurplus(UI.month); commit(true); toast(used ? `Flowed ${fmt(used)} of surplus into your top-ranked goals` : 'No surplus to flow (or all goals are fully funded).', used ? 'ok' : 'warn'); }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); const fn = el && ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); } });

/* inputs */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.classList.contains('planned')) { getMonth(UI.month).planned[t.dataset.cat] = parseMoney(t.value); rev++; save(); renderTabs(); renderSummary(); refreshNumbers(); }
  else if (t.id === 'txQ') { UI.tx.q = t.value; UI.tx.limit = 200; renderTxList(); }
  else if (t.id === 'sideQ') { UI.side.q = t.value; renderSideList(); }
});
document.addEventListener('change', e => {
  const t = e.target, ds = t.dataset || {};
  if (ds.assign !== undefined) assign(ds.assign, t.value);
  else if (ds.incName !== undefined) { const i = getMonth(UI.month).income.find(x => x.id === ds.incName); if (i) { i.name = t.value.trim(); rev++; save(); } }
  else if (ds.incAmt !== undefined) { const ym = UI.month, i = getMonth(ym).income.find(x => x.id === ds.incAmt); if (i) { const prev = totalIncome(ym); i.amount = parseMoney(t.value); afterIncomeChange(prev, ym); commit(true); } }
  else if (ds.rank !== undefined) setRank(ds.rank, +t.value);
  else if (t.classList.contains('row-chk')) { t.checked ? UI.sel.add(ds.id) : UI.sel.delete(ds.id); t.closest('.tx-row').classList.toggle('sel', t.checked); renderBulkBar(); const all = $('#chkAll'); if (all) all.checked = lastFilteredIds.slice(0, UI.tx.limit).every(id => UI.sel.has(id)); }
  else if (t.id === 'chkAll') { lastFilteredIds.slice(0, UI.tx.limit).forEach(id => t.checked ? UI.sel.add(id) : UI.sel.delete(id)); renderTxList(); }
  else if (t.id === 'txStatus') { UI.tx.status = t.value; renderTxList(); }
  else if (t.id === 'txCat') { UI.tx.cat = t.value; renderTxList(); }
  else if (t.id === 'txScope') { UI.tx.scope = t.value; renderTxList(); }
  else if (t.id === 'txSort') { UI.tx.sort = t.value; UI.tx.dir = (t.value === 'date' || t.value === 'amount') ? 'desc' : 'asc'; updateDirBtn(); renderTxList(); }
  else if (t.id === 'sideScope') { UI.side.scope = t.value; renderSideList(); }
  else if (t.id === 'autoFlow') { S.settings.autoFlow = t.checked; rev++; save(); toast(t.checked ? 'New income surplus will now flow to your top-ranked goals' : 'Auto-flow turned off'); }
});
document.addEventListener('click', e => { if (e.target.id === 'txDir') { UI.tx.dir = UI.tx.dir === 'asc' ? 'desc' : 'asc'; updateDirBtn(); renderTxList(); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.planned,[data-inc-amt],[data-inc-name]')) e.target.blur(); });

/* ───────────────────────── drag & drop ───────────────────────── */
let dragTxn = null, dragGoal = null;
const clearDrop = () => $$('.dragging,.drop-target,.drop-above,.drop-below').forEach(n => n.classList.remove('dragging', 'drop-target', 'drop-above', 'drop-below'));
document.addEventListener('dragstart', e => {
  const c = e.target.closest?.('.txn-card'), g = e.target.closest?.('.goal');
  if (c) { dragTxn = c.dataset.txn; e.dataTransfer.setData('text/plain', dragTxn); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging'); document.body.classList.add('dragging-txn'); }
  else if (g) { dragGoal = g.dataset.goal; e.dataTransfer.setData('text/plain', dragGoal); e.dataTransfer.effectAllowed = 'move'; g.classList.add('dragging'); }
});
document.addEventListener('dragend', () => { dragTxn = dragGoal = null; document.body.classList.remove('dragging-txn'); clearDrop(); });
document.addEventListener('dragover', e => {
  if (dragTxn) { const t = e.target.closest('.cat-row') || e.target.closest('#incomeCard'); if (t) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; $$('.drop-target').forEach(n => n !== t && n.classList.remove('drop-target')); t.classList.add('drop-target'); } }
  else if (dragGoal) { const g = e.target.closest('.goal'); if (g && g.dataset.goal !== dragGoal) { e.preventDefault(); const r = g.getBoundingClientRect(), below = e.clientY > r.top + r.height / 2; $$('.drop-above,.drop-below').forEach(n => n.classList.remove('drop-above', 'drop-below')); g.classList.add(below ? 'drop-below' : 'drop-above'); } }
  else if (e.dataTransfer?.types?.includes('Files')) e.preventDefault();
});
document.addEventListener('drop', e => {
  if (dragTxn) {
    const row = e.target.closest('.cat-row'), inc = e.target.closest('#incomeCard'), id = dragTxn; dragTxn = null; document.body.classList.remove('dragging-txn'); clearDrop();
    if (row) { e.preventDefault(); assign(id, row.dataset.cat); } else if (inc) { e.preventDefault(); const t = txn(id); t && t.kind === 'income' ? countIncome(id) : toast('Only deposits can be dropped on Income — drop spending onto a category.', 'warn'); }
  } else if (dragGoal) {
    const g = e.target.closest('.goal'), id = dragGoal; dragGoal = null;
    if (g) { e.preventDefault(); const r = g.getBoundingClientRect(); const below = e.clientY > r.top + r.height / 2; clearDrop(); moveGoalTo(id, g.dataset.goal, below); } else clearDrop();
  } else if (e.dataTransfer?.files?.length) {
    e.preventDefault(); if (!modalStack.length) openImport(e.dataTransfer.files[0]);
  }
});

/* ───────────────────────── init ───────────────────────── */
getMonth(UI.month);
render();
if (storageOK) setInd(S.txns.length || Object.keys(S.months).length > 1 ? 'Loaded from this browser' : 'Auto-saves in this browser');
else setInd('⚠ Storage unavailable');
if (!S.txns.length && !S.projects.length && !Object.values(S.months).some(m => m.income.length || Object.keys(m.planned).length)) {
  setTimeout(() => toast('Welcome! Add income to begin — or load sample data from ⚙ Settings.'), 400);
}
// keep the exchange rate fresh (silent, optional, only the rate is requested)
if (S.settings.autoRate && navigator.onLine !== false && S.settings.rateSrc !== 'manual' && S.settings.rateDate !== today()) setTimeout(() => fetchRate(false), 600);
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { }
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
try { window.matchMedia('(max-width:980px)').addEventListener('change', ev => { if (!ev.matches && UI.tab === 'inbox') { UI.tab = 'budget'; render(); } }); } catch (e) { }
// automatic sync: at start, when you come back to the app, when you reconnect, and every 30 s while it is open
setTimeout(() => runSync(), 900);
setInterval(() => { if (document.visibilityState === 'visible') runSync(); }, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') runSync(); });
window.addEventListener('online', () => runSync());
window.__zb = { runSync, get SC() { return SC; }, get S() { return S; }, set S(v) { S = v; }, UI, ACT, render, parseCSV, parseAmount, PDFR, mergeStates, normalize, fetchRate, applyRules, convertAll, sampleState };
})();
</script>
